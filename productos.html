<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - GEXTEK JM</title>
    <!-- Hoja de estilos propia del módulo de productos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <a class="enlace-volver" href="dashboard.html">&larr; Volver al panel</a>

        <header class="encabezado">
            <h1>
                <img class="logo" src="logo.jpeg" alt="Logo de GEXTEK JM">
                Gestión de productos
            </h1>
            <p>Registra y consulta los productos del inventario.</p>
        </header>

        <!-- Sección 1: formulario de registro -->
        <section aria-labelledby="titulo-registro">
            <h2 id="titulo-registro">Registrar producto</h2>
            <form id="productoForm" class="formulario">
                <div class="campo">
                    <label for="codigo">Código</label>
                    <input id="codigo" maxlength="30" required>
                </div>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" maxlength="100" required>
                </div>
                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <input id="categoria" maxlength="60" required>
                </div>
                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input id="cantidad" type="number" min="0" step="1" required>
                </div>
                <div class="campo">
                    <label for="precio">Precio</label>
                    <input id="precio" type="number" min="0" step="0.01" required>
                </div>
                <div class="campo campo--boton">
                    <button class="boton" type="submit">Registrar producto</button>
                </div>
            </form>

            <!-- Mensajes de éxito o error (los escribe productos.js) -->
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </section>

        <!-- Sección 2: inventario con búsqueda -->
        <section aria-labelledby="titulo-inventario">
            <h2 id="titulo-inventario">Inventario</h2>
            <label class="solo-lectores" for="busqueda">Buscar productos</label>
            <input id="busqueda" class="buscador"
                   placeholder="Buscar por código, nombre o categoría">

            <div class="tabla-contenedor">
                <table class="tabla">
                    <caption class="solo-lectores">Listado de productos del inventario</caption>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <!-- Las filas las genera productos.js -->
                    <tbody id="tablaProductos"></tbody>
                </table>
            </div>
        </section>

        <footer class="pie">GEXTEK JM - Módulo de productos</footer>
    </main>

    <!-- Lógica del módulo (al final para que el DOM ya exista) -->
    <script src="js/productos.js"></script>
</body>
</html>
