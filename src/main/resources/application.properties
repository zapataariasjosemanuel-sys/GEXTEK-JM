$props = @'
# application.properties - GEXTEK JM (Spring Boot)

spring.application.name=gextek-jm-spring

# Puerto 8081 para no chocar con Tomcat (8080)
server.port=8081

# Conexion a PostgreSQL (base gextek_jm, tabla productos)
spring.datasource.url=jdbc:postgresql://localhost:5432/gextek_jm
spring.datasource.username=postgres
spring.datasource.password=Tatiana2014
spring.datasource.driver-class-name=org.postgresql.Driver

# update: usa la tabla existente y la crea si no existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Sin cache de plantillas durante el desarrollo
spring.thymeleaf.cache=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
'@
$ruta = Join-Path (Get-Location) "src\main\resources\application.properties"
[System.IO.File]::WriteAllText($ruta, $props, (New-Object System.Text.UTF8Encoding($false)))
mvn spring-boot:run