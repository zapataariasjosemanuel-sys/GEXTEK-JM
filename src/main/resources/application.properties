# application.properties - GEXTEK JM (Spring Boot)
# La contraseña NO se escribe aquí: se toma de la variable de entorno
# DB_PASSWORD (si no existe, usa el texto TU_CLAVE).

spring.application.name=gextek-jm-spring

# Puerto 8081 para no chocar con Tomcat (8080)
server.port=8081

# Conexión a PostgreSQL (base gextek_jm, tabla productos)
spring.datasource.url=jdbc:postgresql://localhost:5432/gextek_jm
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:TU_CLAVE}

# update: usa la tabla existente y la crea si no existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Sin caché de plantillas durante el desarrollo
spring.thymeleaf.cache=false
