
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GEXTEK JM</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            padding: 20px; background: #F3F4F6;
        }
        .container {
            background: white; width: 100%; max-width: 400px;
            padding: 30px; border-radius: 10px; text-align: center;
            box-shadow: 0 4px 15px #00000015;
        }
        h2 { color: #1E3A8A; }
        .foto {
            width: 90px; height: 90px; margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #DBEAFE;
            color: #1E3A8A; font-size: 25px; font-weight: bold;
        }
        .dato {
            padding: 12px; margin: 10px 0; text-align: left;
            border: 1px solid #D1D5DB; border-radius: 6px;
            overflow-wrap: anywhere;
        }
        .dato strong { color: #1E3A8A; }
        button {
            width: 100%; padding: 12px; margin-top: 12px;
            border: 0; border-radius: 6px; background: #1E3A8A;
            color: white; cursor: pointer;
        }
        .cerrar { background: #DC2626; }
    </style>
</head>
<body>
<main class="container">
    <h2>Mi Perfil</h2>
    <div class="foto">JZ</div>

    <div class="dato"><strong>Nombre:</strong> Jose Manuel Zapata</div>
    <div class="dato"><strong>Correo:</strong> usuario@gextekjm.com</div>
    <div class="dato"><strong>Usuario:</strong> jzapata</div>

    <button onclick="alert('La edición del perfil se habilitará al conectar el backend.')">
        Editar perfil
    </button>
    <button class="cerrar" onclick="location.href='index.html'">
        Cerrar sesión
    </button>
</main>
</body>
</html>
